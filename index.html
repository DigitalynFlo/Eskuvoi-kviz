<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esküvői album kvíz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="keret">
        <div id="fejlec">
            <img src="logo.svg" alt="PintyiPhotography">
            <div class="vonal"></div>
        </div>
        <button class="kilepes" aria-label="Kilépés">&times;</button>
        <div id="progress-bar"></div>
        <div id="oldal_0" class="oldal">Cím és insrtukció</div>
        <div id="oldal_1" class="oldal" hidden>1. képpár</div>
        <div id="oldal_2" class="oldal" hidden>2. képpár</div>
        <div id="oldal_3" class="oldal" hidden>3. képpár</div>
        <div id="oldal_4" class="oldal" hidden>4. képpár</div>
        <div id="oldal_5" class="oldal" hidden>Email cím, dátum, adatkezelési hozzájárulás <button>Küldés</button></div>
        <div id="oldal_6" class="oldal" hidden>Eredmény album oldal</div>
    </div>
    <script src="script.js"></script>
</body>

</html>
